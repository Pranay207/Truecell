name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install ruff==0.11.13
      - run: ruff check truecell tests eval scripts convert.py run.py
      - run: ruff format --check truecell tests eval scripts convert.py run.py
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Verify committed production bundle is current
        run: git diff --exit-code -- frontend/dist
  docker:
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production container
        run: docker compose build
      - name: Start production container
        run: docker compose up -d
      - name: Exercise API, UI and exports
        run: python3 scripts/smoke_server.py --state-file /tmp/truecell-docker-smoke.json
      - name: Verify persistent workspace after restart
        run: |
          docker compose restart truecell
          python3 scripts/smoke_server.py --state-file /tmp/truecell-docker-smoke.json --verify-state-only
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop production container
        if: always()
        run: docker compose down --volumes
